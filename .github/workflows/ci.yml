name: MatchdayDB checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pip-audit
      # pillow is pulled in transitively by fastembed for its (unused here --
      # we only ever call TextEmbedding, never ImageEmbedding) image-model
      # support. The 35 CVEs below are all fixed only in pillow 13.0.0, but
      # fastembed==0.9.0 (the latest release as of 2026-10-23) hard-caps
      # pillow<13.0, so there is currently no installable combination without
      # these ignores. Re-check `pip index versions fastembed` periodically --
      # once a release raises that ceiling, drop this whole ignore list.
      - run: >
          python -m pip_audit -r requirements.txt
          --ignore-vuln CVE-2026-112390 --ignore-vuln CVE-2026-112391
          --ignore-vuln CVE-2026-112392 --ignore-vuln CVE-2026-112393
          --ignore-vuln CVE-2026-112395 --ignore-vuln CVE-2026-112396
          --ignore-vuln CVE-2026-112397 --ignore-vuln CVE-2026-112399
          --ignore-vuln CVE-2026-112400 --ignore-vuln CVE-2026-112401
          --ignore-vuln CVE-2026-112402 --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112405 --ignore-vuln CVE-2026-112406
          --ignore-vuln CVE-2026-112891 --ignore-vuln CVE-2026-112892
          --ignore-vuln CVE-2026-112893 --ignore-vuln CVE-2026-112894
          --ignore-vuln CVE-2026-112895 --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897 --ignore-vuln CVE-2026-112899
          --ignore-vuln CVE-2026-112900 --ignore-vuln CVE-2026-112901
          --ignore-vuln CVE-2026-96636 --ignore-vuln CVE-2026-96637
          --ignore-vuln CVE-2026-96638 --ignore-vuln CVE-2026-96639
          --ignore-vuln CVE-2026-96640 --ignore-vuln CVE-2026-96641
          --ignore-vuln CVE-2026-96642 --ignore-vuln CVE-2026-96643
          --ignore-vuln CVE-2026-96644 --ignore-vuln CVE-2026-96778
          --ignore-vuln GHSA-78g4-xqwv-q3g8
      - run: >
          python -m pip_audit -r requirements-dev.txt
          --ignore-vuln CVE-2026-112390 --ignore-vuln CVE-2026-112391
          --ignore-vuln CVE-2026-112392 --ignore-vuln CVE-2026-112393
          --ignore-vuln CVE-2026-112395 --ignore-vuln CVE-2026-112396
          --ignore-vuln CVE-2026-112397 --ignore-vuln CVE-2026-112399
          --ignore-vuln CVE-2026-112400 --ignore-vuln CVE-2026-112401
          --ignore-vuln CVE-2026-112402 --ignore-vuln CVE-2026-112404
          --ignore-vuln CVE-2026-112405 --ignore-vuln CVE-2026-112406
          --ignore-vuln CVE-2026-112891 --ignore-vuln CVE-2026-112892
          --ignore-vuln CVE-2026-112893 --ignore-vuln CVE-2026-112894
          --ignore-vuln CVE-2026-112895 --ignore-vuln CVE-2026-112896
          --ignore-vuln CVE-2026-112897 --ignore-vuln CVE-2026-112899
          --ignore-vuln CVE-2026-112900 --ignore-vuln CVE-2026-112901
          --ignore-vuln CVE-2026-96636 --ignore-vuln CVE-2026-96637
          --ignore-vuln CVE-2026-96638 --ignore-vuln CVE-2026-96639
          --ignore-vuln CVE-2026-96640 --ignore-vuln CVE-2026-96641
          --ignore-vuln CVE-2026-96642 --ignore-vuln CVE-2026-96643
          --ignore-vuln CVE-2026-96644 --ignore-vuln CVE-2026-96778
          --ignore-vuln GHSA-78g4-xqwv-q3g8
